<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 하루</title>
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 하루">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style id="css">
:root{--bg:#f5f5f4;--card:#fff;--ink:#141414;--ink2:#3a3a3a;--sub:#8c8c8c;--line:#e4e4e4;--soft:#efefef;--mid:#bdbdbd}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:16px 14px 100px;min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
.emo{filter:grayscale(1)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.nav{display:flex;gap:4px;align-items:center;flex:none}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--sub)}
.ib:active{background:var(--line)}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 8px}
.day{aspect-ratio:1/1.15;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:5px;position:relative;font-size:14px}
.day.out{opacity:.25}
.day.sun .n{color:var(--sub)}
.day .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--ink);color:#fff!important}
.day.sel{background:var(--soft)}
.day .mood{font-size:12px;line-height:1;margin-top:1px;filter:grayscale(1)}
.day .dots{display:flex;gap:2px;margin-top:2px}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--ink2)}
.day .hb{position:absolute;bottom:4px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.day .hb i{display:block;height:100%;background:var(--ink)}
h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--sub);font-size:12px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-size:12px;color:var(--ink2);min-width:42px;font-weight:700}
.ev .tx{flex:1;word-break:break-all}
.ev .tx.done{text-decoration:line-through;color:var(--sub)}
.x{color:var(--mid);font-size:18px;padding:0 4px;flex:none}
.row{display:flex;gap:6px;margin-top:10px;align-items:center}
.row input[type=time]{width:108px;flex:none}
.btn{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;white-space:nowrap;font-weight:500;flex:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.4}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
.moods{display:flex;justify-content:space-between;margin-bottom:12px}
.moods button{font-size:28px;width:52px;height:52px;border-radius:14px;opacity:.3;transition:.15s;filter:grayscale(1)}
.moods button.on{opacity:1;background:var(--soft)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
textarea.sm{min-height:70px}
.saveRow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.muted{color:var(--sub);font-size:12px}
.entry{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.entry:last-child{border-bottom:0}
.entry .em{font-size:22px;filter:grayscale(1)}
.entry .d{font-size:12px;color:var(--sub)}
.entry .p{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--mid);display:grid;place-items:center;font-size:15px;flex:none;transition:.15s}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chk.s{width:24px;height:24px;border-radius:7px;font-size:13px}
.habit .nm{flex:1;min-width:0}
.habit .nm b{font-weight:500;display:block}
.wk{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.wk i{width:12px;height:12px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.wk i.on{background:var(--ink);border-color:var(--ink)}
.wk i.fut{opacity:.35}
.streak{font-size:12px;font-weight:700;white-space:nowrap}
.del{font-size:12px;color:var(--mid);padding:4px;flex:none}
.del.warn{color:var(--ink);font-weight:700;text-decoration:underline}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--ink);transition:.3s}
.prog.over i{background:repeating-linear-gradient(45deg,var(--ink) 0 4px,var(--ink2) 4px 8px)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{display:flex;max-width:540px;width:100%}
.tabs button{flex:1;padding:9px 0 11px;font-size:11px;color:var(--mid);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:700}
.status{position:fixed;top:10px;right:12px;font-size:11px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:6}
.status.show{opacity:1}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini .chip{font-size:12px}
/* attendance */
.stbtns{display:flex;gap:4px;flex:none}
.stbtns button{font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
.stbtns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.subj{padding:11px 0;border-bottom:1px solid var(--line)}
.subj:last-child{border-bottom:0}
.subj .hd{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.subj .hd b{flex:1;font-weight:500}
.cnt{display:flex;gap:10px;font-size:12px;color:var(--sub);margin-top:4px}
.cnt em{font-style:normal;color:var(--ink);font-weight:700}
.dchips{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dchips button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:13px}
.dchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hist{margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;font-size:13px}
.badge{display:inline-block;min-width:34px;text-align:center;font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
.badge.P{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge.L{background:var(--mid);color:#fff;border-color:var(--mid)}
.badge.A{border:1.5px solid var(--ink);color:var(--ink);font-weight:700}
.badge.E{background:var(--soft);color:var(--ink2)}
/* plan */
.avail{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.avail label{font-size:12px;color:var(--sub)}
.avail input{text-align:center;padding:8px 2px}
.avail .cl{font-size:10px;color:var(--sub);margin-top:2px;min-height:12px}
.load{display:grid;grid-template-columns:28px 1fr 64px;gap:6px 8px;align-items:center;font-size:12px}
.load .prog{margin:0}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .tx{flex:1;min-width:0;word-break:break-all}
.task .meta{font-size:11px;color:var(--sub)}
.task select{width:64px;padding:5px 4px;font-size:12px;flex:none}
.hin{width:58px!important;flex:none;text-align:center}
.ai{border:1.5px solid var(--ink)}
.ai .out{font-size:14px;line-height:1.75;margin-top:10px;white-space:normal}
.ai .out b{font-weight:700}
.ai .out .li{padding-left:14px;position:relative}
.ai .out .li:before{content:'·';position:absolute;left:4px}
.ai .out .hd{font-weight:700;margin-top:8px}
.verdict{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
.goal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .tx{flex:1;min-width:0}
.goal .tx.done{text-decoration:line-through;color:var(--sub)}
.tag{font-size:11px;color:var(--sub);margin-right:6px}
.big{font-size:28px;font-weight:700;letter-spacing:-1px}
.stats{display:flex;justify-content:space-between;text-align:center}
.stats div{flex:1}
.stats .muted{margin-top:2px}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .t{display:flex;justify-content:space-between;font-size:14px}
.mrow .t span{font-weight:700}
.col-today{border:1.5px solid var(--ink)}
.col-q{font-size:21px;font-weight:700;letter-spacing:-.4px;margin:6px 0 12px;line-height:1.4}
.col-ph{width:100%;border-radius:12px;margin-top:10px;display:block;filter:grayscale(.15)}
.col-sec{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700;text-align:left}
.col-it{display:flex;gap:10px;align-items:center;padding:8px 2px;border-top:1px dashed var(--line);width:100%;text-align:left;font-size:14px}
.col-it .no{width:22px;color:var(--sub);font-size:12px;flex:none}
.col-it .q{flex:1}
.col-it.cur{background:var(--soft);border-radius:8px}
.col-it .ok{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mid);flex:none;display:grid;place-items:center;font-size:10px}
.col-it .ok.on{background:var(--ink);border-color:var(--ink);color:#fff}
.col-all h3{font-size:13px;color:var(--sub);font-weight:500;margin:18px 0 8px}
.col-all .a{padding:12px 0;border-bottom:1px solid var(--line)}
.col-all .a b{display:block;font-size:13px;margin-bottom:4px}
.col-all .a p{font-size:14px;line-height:1.7;white-space:pre-wrap}
.filebtn{display:inline-block;cursor:pointer}
.blk{padding:12px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .bh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.blk .bh b{font-size:15px}
.blk .bh span{font-size:12px;color:var(--sub)}
.blk.now{border-left:3px solid var(--ink);padding-left:10px;margin-left:-14px;padding-right:0}
.blk .ev .tm{min-width:38px}
.nowtag{font-size:11px;background:var(--ink);color:#fff;padding:1px 7px;border-radius:99px;margin-left:auto}
.fb{display:block;width:100%;margin-top:8px;font-size:12px;min-height:80px}
</style>
</head>
<body>
<div id="app"></div>
<div class="status" id="status"></div>
<script type="application/json" id="state">{"v":2,"events":{},"diary":{},"habits":[{"id":"h1","name":"물 8잔 마시기","emoji":"💧","done":{}},{"id":"h2","name":"30분 공부","emoji":"📚","done":{}},{"id":"h3","name":"피아노 연습","emoji":"🎹","done":{}}],"att":{"start":"2026-09-01","end":"2026-12-19","subjects":[{"id":"s1","name":"측량학II","days":[]},{"id":"s2","name":"컴퓨터프로그래밍","days":[]},{"id":"s3","name":"공학미적분","days":[]},{"id":"s4","name":"재료역학","days":[]}],"rec":{}},"plans":{"weeks":{},"months":{}},"goals":[],"savedAt":0}</script>
<script id="main">
(function(){
const MAIN_SRC = document.getElementById('main').outerHTML;
const CSS_SRC = document.getElementById('css').outerHTML;
let S = JSON.parse(document.getElementById('state').textContent);
const HAS_CLAUDE=typeof claude!=='undefined'&&!!claude&&typeof claude.use==='function';
const STANDALONE=!HAS_CLAUDE;
const LS_KEY=STANDALONE?'myday-data':'myday-backup';
if(STANDALONE){try{const b=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(b&&typeof b==='object')S=b;}catch(e){}}
function norm(){
  S.events=S.events||{}; S.diary=S.diary||{}; S.habits=S.habits||[];
  S.att=S.att||{start:'2026-09-01',end:'2026-12-19',subjects:[],rec:{}};
  S.att.rec=S.att.rec||{}; S.att.subjects=S.att.subjects||[];
  S.plans=S.plans||{}; S.plans.weeks=S.plans.weeks||{}; S.plans.months=S.plans.months||{};S.plans.days=S.plans.days||{};
  S.goals=S.goals||[];
  S.collect=S.collect||{items:{}};S.collect.items=S.collect.items||{};
}
norm();

const MOODS=['😄','🙂','😐','😢','😡'];
const WD=['일','월','화','수','목','금','토'];
const WDM=['월','화','수','목','금','토','일']; // monday-first
const ST={P:'출석',L:'지각',A:'결석',E:'공결',C:'휴강'};
const COL_START='2026-11-12',COL_END='2026-12-31';
const COL_SEC=['좋아했던 것','새로 발견한 것','달라진 나','마음에 남은 순간','앞으로 남길 것'];
const COL=['자주 들은 노래','다시 먹고 싶은 음식','마음에 든 장소','오래 남은 작품','눈길이 간 색','자주 입은 옷','손이 많이 간 문구','좋아하는 사진 한 장','소소한 즐거움','나만의 소중한 물건',
'처음 해본 일','뜻밖의 취향','써먹어 본 배움','우연히 발견한 공간','추천받아 좋아진 것','새로 구독한 채널','생각보다 쉬웠던 일','생활을 바꾼 도구','나와 안 맞았던 것','최근 알게 된 사실',
'덜 좋아하게 된 것','새로 생긴 관심사','달라진 소비 기준','조금 익숙해진 일','그만두기로 한 것','내 취향대로 한 선택','생각이 바뀐 계기','자주 했던 말','스스로 기특했던 일','올해 초와 달라진 나',
'작은 행복을 느낀 순간','크게 웃었던 기억','에너지가 빠진 순간','기운을 되찾은 방법','혼자라서 좋았던 시간','함께라서 좋았던 시간','오래 남은 한마디','고마웠던 배려','기대와 달랐던 경험','요즘 마음을 차지한 것',
'올해 잘 산 물건','다시는 안 살 물건','돈 없이 즐긴 것','아깝지 않았던 시간','기억하고 싶은 하루','다시 꺼내고 싶은 취미','아직 해보고 싶은 일','이어가고 싶은 습관','내년에도 함께할 사람','기록하며 발견한 나'];
const CATS=['학업','진로','건강','자기계발','취미','기타'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=fmt(new Date());
const label=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'+(s===TODAY?' · 오늘':'');};
const short=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};
const uid=()=>Math.random().toString(36).slice(2,9);
const monday=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7));};
const ymAdd=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return fmt(d).slice(0,7);};
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return y+'년 '+m+'월';};
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};

let UI={tab:'cal',sel:TODAY,ym:TODAY.slice(0,7),planView:'day',hm:TODAY.slice(0,7),attEdit:false,open:null,dv:'diary',colN:0,colView:'one',colSec:-1,imOpen:false};
try{const u=JSON.parse(sessionStorage.getItem('myday-ui')||'null');if(u)UI=Object.assign(UI,u);}catch(e){}
const saveUI=()=>{try{sessionStorage.setItem('myday-ui',JSON.stringify(UI));}catch(e){}};
let draft=null, delArm=null, aiBusy=false, aiLive='';

// ---------- persistence ----------
let art=null, sample=null, timer=null;
const statusEl=document.getElementById('status');
function flash(t){statusEl.textContent=t;statusEl.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>statusEl.classList.remove('show'),1500);}
function buildDoc(){
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>나의 하루</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">\n'
   +CSS_SRC+'\n</head>\n<body>\n<div id="app"></div>\n<div class="status" id="status"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n'+MAIN_SRC+'\n</body>\n</html>';
}
function persist(now){
  S.savedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){if(STANDALONE){flash('저장 공간이 부족해요');return;}}
  if(STANDALONE){flash('저장됨');return;}
  if(!art){flash('이 기기에 저장됨');return;}
  clearTimeout(timer); flash('저장 중…');
  timer=setTimeout(async()=>{saveUI();try{await art.publish(buildDoc());}catch(e){if(String(e&&e.code||e).includes('conflict'))return;flash('저장 실패');}},now?50:1200);
}
if(HAS_CLAUDE){claude.use('artifact').then(a=>{
  art=a;
  if(!a){try{const b=JSON.parse(localStorage.getItem('myday-backup')||'null');if(b&&(b.savedAt||0)>(S.savedAt||0)){S=b;norm();render();}}catch(e){}}
}).catch(()=>{});

const app=document.getElementById('app');
const habitRatio=date=>S.habits.length?S.habits.filter(h=>h.done[date]).length/S.habits.length:0;
function streak(h,from){let n=0,d=from;if(!h.done[d])d=addDays(d,-1);while(h.done[d]){n++;d=addDays(d,-1);}return n;}
const inSem=s=>s>=S.att.start&&s<=S.att.end;
const classesOn=s=>inSem(s)?S.att.subjects.filter(x=>x.days.includes(parse(s).getDay())):[];
const recKey=(id,d)=>id+'|'+d;
function sessions(sub){const out=[];let d=S.att.start;const last=S.att.end;while(d<=last){if(sub.days.includes(parse(d).getDay()))out.push(d);d=addDays(d,1);}return out;}
function attStats(sub){
  const c={P:0,L:0,A:0,E:0,C:0,none:0,total:0,future:0};
  sessions(sub).forEach(d=>{const r=S.att.rec[recKey(sub.id,d)];if(d>TODAY&&!r){c.future++;return;}if(r)c[r]++;else c.none++;});
  c.total=c.P+c.L+c.A+c.E;
  c.rate=c.total?Math.round((c.P+c.L+c.E)/c.total*100):null;
  return c;
}

function md(t){ // tiny markdown → html
  return esc(t).split('\n').map(l=>{
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^#{1,4}\s/.test(l))return '<div class="hd">'+l.replace(/^#{1,4}\s/,'')+'</div>';
    if(/^\s*[-*•]\s/.test(l))return '<div class="li">'+l.replace(/^\s*[-*•]\s/,'')+'</div>';
    return l.trim()?'<div>'+l+'</div>':'<div style="height:6px"></div>';
  }).join('');
}

한국어로 친근하지만 솔직하게, 휴대폰 한 화면 반 이내. 마크다운은 **굵게**와 "- " 목록만.

async function runAI(mode){
  if(!sample||aiBusy)return;
  const memoEl=document.getElementById('aiMemo');
  const obj=mode==='week'?weekObj(monday(UI.sel)):monthObj(UI.ym);
  if(memoEl)obj.memo=memoEl.value;
  aiBusy=true;aiLive='';render();
  const out=()=>document.getElementById('aiOut');
  try{
    const r=await sample(mode==='week'?promptWeek(monday(UI.sel)):promptMonth(UI.ym),{cache:false,onText:({text})=>{aiLive=text;const o=out();if(o)o.innerHTML=md(text);}});
    obj.advice=r.text;const n=new Date();obj.adviceAt=(n.getMonth()+1)+'/'+n.getDate()+' '+pad(n.getHours())+':'+pad(n.getMinutes());
    aiBusy=false;render();persist(true);
  }catch(e){
    aiBusy=false;render();const o=out();
    if(o)o.innerHTML='<div class="muted">'+(e&&e.code==='rate_limited'?'요청이 많아요. 잠시 후 다시 시도해주세요.':e&&e.code==='not_granted'?'AI 사용이 허용되지 않았어요.':'점검에 실패했어요. 다시 시도해주세요.')+'</div>';
  }
}

// ---------- goals ----------
function renderGoals(){
  const g=S.goals,done=g.filter(x=>x.done).length,pct=g.length?Math.round(done/g.length*100):0;
  const sorted=g.slice().sort((a,b)=>(a.done-b.done)||((a.month||'9999').localeCompare(b.month||'9999')));
  const months=[...Array(13)].map((_,i)=>ymAdd(TODAY.slice(0,7),i));
  return `<div class="top"><h1>1년 안에 이룰 것</h1></div>
  <div class="card"><div class="stats"><div><div class="big">${pct}%</div><div class="muted">달성</div></div><div><div class="big">${done}</div><div class="muted">완료</div></div><div><div class="big">${g.length-done}</div><div class="muted">남음</div></div></div><div class="prog" style="margin-top:12px"><i style="width:${pct}%"></i></div></div>
  <div class="card">${sorted.length?sorted.map(x=>`<div class="goal"><button class="chk s ${x.done?'on':''}" data-act="gDone" data-id="${x.id}">${x.done?'✓':''}</button>
    <div class="tx ${x.done?'done':''}"><div>${esc(x.text)}</div><div><span class="tag">${esc(x.cat||'기타')}</span>${x.month?`<span class="tag">~ ${x.month.replace('-','.')}</span>`:''}${x.done&&x.doneAt?`<span class="tag">${x.doneAt} 완료</span>`:''}</div></div>
    <button class="del ${delArm===x.id?'warn':''}" data-act="gDel" data-id="${x.id}">${delArm===x.id?'삭제?':'×'}</button></div>`).join(''):'<div class="empty">1년 안에 꼭 해보고 싶은 것들을 적어보세요</div>'}
    <div class="row"><input id="gText" placeholder="예: 토익 850점, 교환학생 지원" enterkeyhint="done"></div>
    <div class="row"><select id="gCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="gMonth"><option value="">기한 없음</option>${months.map(m=>`<option value="${m}">${m.replace('-','.')}까지</option>`).join('')}</select><button class="btn" data-act="gAdd">추가</button></div>
  </div>`;
}

// ---------- render ----------
function render(){
  const R={cal:renderCal,plan:renderPlan,att:renderAtt,habit:renderHabit,diary:()=>UI.dv==='col'?renderCollect():renderDiary(),goal:renderGoals};
  const names={cal:'캘린더',plan:'계획',att:'출결',habit:'습관',diary:'다이어리',goal:'목표'};
  app.innerHTML=(R[UI.tab]||renderCal)()+`<nav class="tabs"><div>${Object.keys(names).map(k=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-t="${k}">${ICON[k]}${names[k]}</button>`).join('')}</div></nav>`;
  saveUI();
}

// ---------- actions ----------
function setSel(s){UI.sel=s;UI.ym=s.slice(0,7);delArm=null;}
const A={
  tab:t=>{UI.tab=t.dataset.t;delArm=null;window.scrollTo(0,0);},
  pick:t=>setSel(t.dataset.d), pick2:t=>{setSel(t.dataset.d);window.scrollTo(0,0);},
  goToday:()=>setSel(TODAY),
  prevDay:()=>setSel(addDays(UI.sel,-1)), nextDay:()=>setSel(addDays(UI.sel,1)),
  prevW:()=>setSel(addDays(UI.sel,-7)), nextW:()=>setSel(addDays(UI.sel,7)),
  prevM:()=>{UI.ym=ymAdd(UI.ym,-1);}, nextM:()=>{UI.ym=ymAdd(UI.ym,1);},
  hmPrev:()=>{UI.hm=ymAdd(UI.hm,-1);}, hmNext:()=>{UI.hm=ymAdd(UI.hm,1);},
  addEv:()=>{const tx=document.getElementById('evText').value.trim();if(!tx)return false;(S.events[UI.sel]=S.events[UI.sel]||[]).push({id:uid(),text:tx,time:document.getElementById('evTime').value});persist();},
  delEv:t=>{S.events[UI.sel]=(S.events[UI.sel]||[]).filter(e=>e.id!==t.dataset.id);if(!S.events[UI.sel].length)delete S.events[UI.sel];persist();},
  mood:t=>{draft.mood=draft.mood===t.dataset.m?'':t.dataset.m;},
  saveDiary:()=>{draft.text=document.getElementById('diaryText').value;if(!draft.text.trim()&&!draft.mood)delete S.diary[UI.sel];else S.diary[UI.sel]={mood:draft.mood,text:draft.text};persist(true);},
  delDiary:()=>{if(delArm!=='diary'){delArm='diary';return;}delete S.diary[UI.sel];draft=null;delArm=null;persist(true);},
  toggle:t=>{const h=S.habits.find(x=>x.id===t.dataset.id);if(h.done[UI.sel])delete h.done[UI.sel];else h.done[UI.sel]=true;persist();},
  addHabit:()=>{const n=document.getElementById('hName').value.trim();if(!n)return false;S.habits.push({id:uid(),name:n,emoji:document.getElementById('hEmoji').value.trim()||'🌱',done:{}});persist();},
  delHabit:t=>{const id=t.dataset.id;if(delArm!==id){delArm=id;return;}S.habits=S.habits.filter(h=>h.id!==id);delArm=null;persist();},
  dv:t=>{UI.dv=t.dataset.v;},
  colToday:()=>{UI.tab='diary';UI.dv='col';UI.colView='one';UI.colN=0;UI.colSec=-1;window.scrollTo(0,0);},
  colV:t=>{UI.colView=t.dataset.v;},
  colPrev:()=>{const n=UI.colN||colTodayN();UI.colN=Math.max(1,n-1);UI.colSec=-1;},
  colNext:()=>{const n=UI.colN||colTodayN();UI.colN=Math.min(50,n+1);UI.colSec=-1;},
  colGo:t=>{UI.colN=+t.dataset.n;UI.colSec=-1;window.scrollTo(0,0);},
  colSec:t=>{const i=+t.dataset.i;const cur=UI.colSec>=0?UI.colSec:Math.floor(((UI.colN||colTodayN())-1)/10);UI.colSec=cur===i?99:i;},
  colSave:t=>{const ta=document.getElementById('colText');colSetText(+t.dataset.n,ta?ta.value:'');persist(true);},
  colPhDel:t=>{const n=+t.dataset.n,it=S.collect.items[n];if(it){delete it.photo;if(!(it.text||'').trim())delete S.collect.items[n];}persist(true);},
  exCopy:()=>{copyText(JSON.stringify(S),'bkMsg');return false;},
  exFile:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='나의하루_백업_'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){flash('저장 실패');}return false;},
  imOpen:()=>{UI.imOpen=!UI.imOpen;delArm=null;},
  imDo:()=>{const v=(document.getElementById('imText')||{}).value||'';let o;try{o=JSON.parse(v);}catch(e){document.getElementById('bkMsg').innerHTML='<div class="muted">백업 내용이 올바르지 않아요.</div>';return false;}
    if(!o||typeof o!=='object'||!('habits' in o||'events' in o)){document.getElementById('bkMsg').innerHTML='<div class="muted">나의 하루 백업이 아닌 것 같아요.</div>';return false;}
    if(delArm!=='im'){delArm='im';const keep=v;setTimeout(()=>{const t=document.getElementById('imText');if(t)t.value=keep;},0);return;}
    S=o;norm();delArm=null;UI.imOpen=false;persist(true);flash('불러왔어요');},
  aiCopy:t=>{const mode=t.dataset.mode;const m=document.getElementById('aiMemo');const obj=mode==='week'?weekObj(monday(UI.sel)):monthObj(UI.ym);if(m)obj.memo=m.value;copyText(mode==='week'?promptWeek(monday(UI.sel)):promptMonth(UI.ym),'aiOut');return false;},
  // attendance
  mark:t=>{const k=recKey(t.dataset.id,t.dataset.d);if(S.att.rec[k]===t.dataset.k)delete S.att.rec[k];else S.att.rec[k]=t.dataset.k;persist();},
  cycle:t=>{const k=recKey(t.dataset.id,t.dataset.d),order=[undefined,'P','L','A','E','C'];const i=order.indexOf(S.att.rec[k]);const nx=order[(i+1)%order.length];if(nx)S.att.rec[k]=nx;else delete S.att.rec[k];persist();},
  fillP:t=>{const s=S.att.subjects.find(x=>x.id===t.dataset.id);sessions(s).forEach(d=>{const k=recKey(s.id,d);if(d<=TODAY&&!S.att.rec[k])S.att.rec[k]='P';});persist(true);},
  openSubj:t=>{UI.open=UI.open===t.dataset.id?null:t.dataset.id;},
  attEdit:()=>{UI.attEdit=!UI.attEdit;delArm=null;},
  sDay:t=>{const s=S.att.subjects.find(x=>x.id===t.dataset.id),w=+t.dataset.w;s.days=s.days.includes(w)?s.days.filter(d=>d!==w):s.days.concat(w);persist();},
  addSubj:()=>{const n=document.getElementById('sName').value.trim();if(!n)return false;S.att.subjects.push({id:uid(),name:n,days:[]});persist();},
  delSubj:t=>{const id=t.dataset.id;if(delArm!==id){delArm=id;return;}S.att.subjects=S.att.subjects.filter(s=>s.id!==id);Object.keys(S.att.rec).forEach(k=>{if(k.startsWith(id+'|'))delete S.att.rec[k];});delArm=null;persist();},
  // plan
  pv:t=>{UI.planView=t.dataset.v;},
  dAdd:t=>{const b=+t.dataset.b,el=document.getElementById('dIn'+b);const tx=el?el.value.trim():'';if(!tx)return false;dayObj(UI.sel).blocks[b].push({id:uid(),text:tx,done:false});persist();},
  dDone:t=>{const x=dayObj(UI.sel).blocks[+t.dataset.b].find(z=>z.id===t.dataset.id);if(x){x.done=!x.done;persist();}},
  dDel:t=>{const o=dayObj(UI.sel),b=+t.dataset.b;o.blocks[b]=o.blocks[b].filter(z=>z.id!==t.dataset.id);persist();},
  goWeek:t=>{setSel(t.dataset.d);UI.planView='week';window.scrollTo(0,0);},
  tAdd:()=>{const tx=document.getElementById('tText').value.trim();if(!tx)return false;weekObj(monday(UI.sel)).tasks.push({id:uid(),text:tx,h:+document.getElementById('tH').value||0,day:-1,done:false});persist();},
  tDone:t=>{const x=weekObj(monday(UI.sel)).tasks.find(z=>z.id===t.dataset.id);x.done=!x.done;persist();},
  tDel:t=>{const w=weekObj(monday(UI.sel));w.tasks=w.tasks.filter(z=>z.id!==t.dataset.id);persist();},
  mgAdd:()=>{const tx=document.getElementById('mgText').value.trim();if(!tx)return false;monthObj(UI.ym).goals.push({id:uid(),text:tx,done:false});persist();},
  mgDone:t=>{const g=monthObj(UI.ym).goals.find(z=>z.id===t.dataset.id);g.done=!g.done;persist();},
  mgDel:t=>{const m=monthObj(UI.ym);m.goals=m.goals.filter(z=>z.id!==t.dataset.id);persist();},
  ai:t=>{runAI(t.dataset.mode);return false;},
  // goals
  gAdd:()=>{const tx=document.getElementById('gText').value.trim();if(!tx)return false;S.goals.push({id:uid(),text:tx,cat:document.getElementById('gCat').value,month:document.getElementById('gMonth').value,done:false});persist();},
  gDone:t=>{const g=S.goals.find(z=>z.id===t.dataset.id);g.done=!g.done;g.doneAt=g.done?short(TODAY):'';persist();},
  gDel:t=>{const id=t.dataset.id;if(delArm!==id){delArm=id;return;}S.goals=S.goals.filter(z=>z.id!==id);delArm=null;persist();}
};
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act!=='mood'&&t.dataset.act!=='saveDiary'){const ta=document.getElementById('diaryText');if(ta&&draft)draft.text=ta.value;}
  if(A[t.dataset.act](t)===false)return;
  render();
});
app.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='colPhoto'&&el.files&&el.files[0]){const n=+el.dataset.n;const ta=document.getElementById('colText');try{const url=await resizeImg(el.files[0]);const it=S.collect.items[n]||{};if(ta)it.text=ta.value;it.photo=url;it.at=TODAY;S.collect.items[n]=it;persist(true);render();}catch(err){flash('사진을 읽지 못했어요');}return;}
  if(el.id==='imFile'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{const t=document.getElementById('imText');if(t)t.value=fr.result;};fr.readAsText(el.files[0]);return;}
  const c=el.dataset.ch;if(!c)return;
  if(c==='avail'){weekObj(monday(UI.sel)).avail[+el.dataset.i]=Math.max(0,+el.value||0);persist();render();}
  else if(c==='tDay'){const x=weekObj(monday(UI.sel)).tasks.find(z=>z.id===el.dataset.id);x.day=+el.value;persist();render();}
  else if(c==='dNote'){dayObj(UI.sel).note=el.value;persist();}
  else if(c==='colText'){colSetText(+el.dataset.n,el.value);persist();}
  else if(c==='memo'){const o=el.dataset.mode==='week'?weekObj(monday(UI.sel)):monthObj(UI.ym);o.memo=el.value;persist();}
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const map={evText:'addEv',hName:'addHabit',sName:'addSubj',tH:'tAdd',mgText:'mgAdd',gText:'gAdd'};
  if(/^dIn\d$/.test(e.target.id)){if(A.dAdd({dataset:{b:e.target.id.slice(3)}})!==false)render();return;}
  if(e.target.id==='tText'){document.getElementById('tH').focus();return;}
  if(map[e.target.id]){if(A[map[e.target.id]]()!==false)render();}
});
app.addEventListener('input',e=>{
  if(e.target.id==='diaryText'&&draft){draft.text=e.target.value;const s=S.diary[UI.sel]||{};const el=document.getElementById('dirty');if(el)el.textContent=(draft.text!==(s.text||'')||draft.mood!==(s.mood||''))?'저장 안 된 변경 있음':'저장됨';}
});
render();
})();
</script>
</body>
</html>
